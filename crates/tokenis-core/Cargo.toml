[package]
name = "tokenis-core"
description = "Tokenis cryptographic core: EC-ElGamal additive homomorphic encryption and no-key delegation over secp256k1"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tokenis-core"
keywords = ["homomorphic", "elgamal", "secp256k1", "cryptography", "delegation"]
categories = ["cryptography"]
# proptest regression seeds are for this repository's CI, not for users.
exclude = ["proptest-regressions/"]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "std"] }
getrandom = "0.2"
rand_core = "0.6"
subtle = "2"
zeroize = "1"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
