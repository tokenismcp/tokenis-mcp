name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published CVE in a dependency fails CI even when
    # nobody has pushed code.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  security:
    # Known-vulnerability scan of the resolved dependency set (PyPA
    # advisory database + OSV). The flake8-bandit (S) lint rules run as
    # part of `ruff check .` in the core job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with all extras
        run: pip install -e ".[dev,research,server]"
      - name: pip-audit
        run: pip-audit --skip-editable

  typecheck:
    # mypy on tokenis/ only (the product SDK) -- see pyproject.toml's
    # [tool.mypy] comment for why research/ isn't included in the same run.
    # Runs once; type errors don't vary across supported Python versions
    # for code this repository keeps 3.9-compatible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: mypy
        run: mypy tokenis --ignore-missing-imports

  core:
    # Crypto/semantic/gateway/audit core + the P3/P4 research reproduction:
    # no mcp dependency, runs on the package's Python floor.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev,research]"
      - name: Lint
        run: ruff check .
      - name: Test (excluding the MCP server, which needs Python >=3.10)
        run: |
          pytest -q --cov=tokenis --cov-report=term-missing \
            tests research/p3_leakage research/p4_admission tokenis/conformance
      - name: Verify P3 claims pipeline
        run: python research/p3_leakage/verify_claims.py
      - name: Verify P4 claims pipeline
        run: python research/p4_admission/verify_claims.py

  mcp-server:
    # The MCP transport layer: needs the `mcp` package, which requires
    # Python >=3.10.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with server extra
        run: pip install -e ".[dev,server]"
      - name: Test MCP server
        run: pytest -q --cov=tokenis.mcp_server --cov=tokenis.gateway.service --cov-report=term-missing tokenis/mcp_server
      - name: Run quickstart example end-to-end
        run: python examples/quickstart.py
