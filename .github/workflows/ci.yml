name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev,research]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Verify P3 claims pipeline
        run: python research/p3_leakage/verify_claims.py
      - name: Verify P4 claims pipeline
        run: python research/p4_admission/verify_claims.py
