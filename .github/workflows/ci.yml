name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory against any dependency (Rust,
    # Python or npm) fails CI even when nobody has pushed code.
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    # The cryptographic core: formatting, lints (no unwrap/expect/panic/
    # indexing, no unsafe), unit + property tests, and a wasm32 build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p tokenis-core --release
      - run: cargo build -p tokenis-wasm --target wasm32-unknown-unknown --release

  python:
    # Crypto (via the Rust extension), gateway, research reproduction and
    # conformance suite, on the package's Python floor and up.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (builds the Rust extension)
        run: pip install -e ".[dev,research]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy tokenis --ignore-missing-imports
      - name: Test (the MCP server needs Python >=3.10; see the mcp-server job)
        run: |
          pytest -q --cov=tokenis --cov-report=term-missing \
            tests research/p3_leakage research/p4_admission tokenis/conformance
      - name: Verify P3 claims pipeline
        run: python research/p3_leakage/verify_claims.py
      - name: Verify P4 claims pipeline
        run: python research/p4_admission/verify_claims.py

  mcp-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with server extra
        run: pip install -e ".[dev,server]"
      - name: Test MCP server
        run: pytest -q --cov=tokenis.mcp_server --cov=tokenis.gateway.service --cov-report=term-missing tokenis/mcp_server
      - name: Run quickstart example end-to-end
        run: python examples/quickstart.py

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Built package loads on the oldest supported Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node -e "import('./dist/index.js').then(m => { const k = m.keygen(); if (m.decrypt(k.privateKey, m.encrypt(k.publicKey, 7n)) !== 7n) process.exit(1); })"

  interop:
    # Python and TypeScript exchange real ciphertexts, keys and masked
    # values (tests/test_interop.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: npm ci && npm run build:wasm && npm run build
      - run: pip install -e ".[dev]"
      - run: pytest -q -rs tests/test_interop.py

  security:
    # Known-vulnerability scans of every dependency graph.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (RustSec)
        run: cargo audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with all extras
        run: pip install -e ".[dev,research,server]"
      - name: pip-audit (PyPA advisories + OSV)
        run: pip-audit --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm audit
        working-directory: sdk/typescript
        run: npm ci && npm audit --audit-level=low
