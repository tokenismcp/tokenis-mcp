name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory against any dependency (Rust,
    # Python or npm) fails CI even when nobody has pushed code.
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    # The cryptographic core: formatting, lints (no unwrap/expect/panic/
    # indexing, no unsafe), unit + property tests, and a wasm32 build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p tokenis-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p tokenis-core --release
      - run: cargo build -p tokenis-wasm --target wasm32-unknown-unknown --release
      - name: Third-party notices are up to date
        run: cargo fetch --locked && python3 scripts/third_party_notices.py --check

  msrv:
    # rust-version in Cargo.toml is a promise; check it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace --locked

  python:
    # Crypto (via the Rust extension), gateway, research reproduction and
    # conformance suite, on the package's Python floor and up. Tests that
    # need the `server` extra skip themselves here; see mcp-server.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (builds the Rust extension)
        run: pip install -e ".[dev,research]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy tokenis --ignore-missing-imports
      - name: Test
        run: |
          pytest -q -rs --cov=tokenis --cov-report=term-missing \
            tests research/p3_leakage research/p4_admission tokenis/conformance
      - name: Verify P3 claims pipeline
        run: python research/p3_leakage/verify_claims.py
      - name: Verify P4 claims pipeline
        run: python research/p4_admission/verify_claims.py

  mcp-server:
    # The MCP server, CLI, HTTP authentication and LLM toolkit (Python >=3.10),
    # including real stdio and authenticated-HTTP end-to-end sessions.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with server extra
        run: pip install -e ".[dev,server]"
      - name: Test
        run: |
          pytest -q -rs --cov=tokenis --cov-report=term-missing \
            tests tokenis/mcp_server tokenis/conformance
      - name: Example config validates
        run: |
          export TOKENIS_TOKENIZER_KEY=$(tokenis-mcp keygen-secret) TOKENIS_AUDIT_KEY=$(tokenis-mcp keygen-secret)
          tokenis-mcp check --config examples/tokenis.toml
      - name: Run quickstart example end-to-end
        run: python examples/quickstart.py

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Packed tarball installs, type-checks and runs (ESM + CJS)
        run: npm run check:package

  interop:
    # Python and TypeScript exchange real ciphertexts, keys and masked
    # values (tests/test_interop.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: npm ci && npm run build:wasm && npm run build
      - run: pip install -e ".[dev]"
      - run: pytest -q -rs tests/test_interop.py

  security:
    # Known-vulnerability scans of every dependency graph.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (RustSec)
        run: cargo audit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with all extras
        run: pip install -e ".[dev,research,server,llm]"
      - name: pip-audit (PyPA advisories + OSV)
        run: pip-audit --skip-editable
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: npm audit
        working-directory: sdk/typescript
        run: npm ci && npm audit --audit-level=low
