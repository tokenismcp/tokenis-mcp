name: Release

# A version tag publishes Tokenis through GitHub alone -- no external
# package registry or account is involved:
#   - GitHub Release: wheels for every platform (abi3: one per platform
#     serves CPython >= 3.10), the sdist, the npm tarball and the Claude
#     Desktop bundle (tokenis.mcpb), each with build provenance.
#   - GitHub Pages: a package index (packaging/build_index.py) pointing at
#     every release's wheels, so `uvx --index
#     https://tokenismcp.github.io/tokenis-mcp/simple/ tokenis-mcp` works.
#     One-time setup: Settings -> Pages -> Source: "GitHub Actions".
#   - GitHub Container Registry: ghcr.io/<owner>/tokenis-mcp (multi-arch).
# Optional, each behind its own repository variable:
#   - PUBLISH_REGISTRY=true: list server.json in the MCP Registry (GitHub
#     OIDC; needs the GHCR image to be public so the registry can verify it).
#   - PUBLISH_NPM=true: publish @tokenis/crypto to npm (needs an "npm"
#     environment with an NPM_TOKEN secret).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    # A tag must match every manifest's version, or the artifacts would
    # claim a version the source does not.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches pyproject.toml, Cargo.toml and package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          rs=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          js=$(node -p "require('./sdk/typescript/package.json').version")
          echo "tag=$tag pyproject=$py cargo=$rs npm=$js"
          test "$tag" = "$py" && test "$tag" = "$rs" && test "$tag" = "$js"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Plugin, marketplace, server.json and MCPB versions match too
        run: |
          pip install jsonschema
          python -c "import sys; sys.path.insert(0, 'packaging'); import check_packaging as c; c.check_versions(); c.check_server_json()"

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `smoke`: the wheel matches the runner, so it can be installed
          # and exercised there (cross-compiled / musl wheels cannot).
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, smoke: true }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: macos-14, target: aarch64, smoke: true }
          - { os: macos-15-intel, target: x86_64, smoke: true }
          - { os: windows-latest, target: x64, smoke: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - name: Smoke-test the wheel
        if: matrix.smoke
        shell: bash
        run: |
          pip install "$(ls dist/*.whl)[server]"
          # Run outside the checkout so the installed wheel is imported, not
          # the uncompiled source tree.
          cd "$RUNNER_TEMP"
          python -c "from tokenis.crypto.ec_fhe import keygen, encrypt, decrypt; k = keygen(); assert decrypt(k.private, encrypt(k.public, 7)) == 7"
          tokenis-mcp tools --demo --format anthropic > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: sdist carries the license files
        run: tar tzf dist/*.tar.gz | grep -E '/(LICENSE|THIRD-PARTY-NOTICES.md)$'
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  npm-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci && npm run build:wasm && npm run typecheck && npm run build && npm test
      - run: npm run check:package
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: sdk/typescript/*.tgz

  mcpb:
    # The Claude Desktop extension: a manifest plus a uv entry point that
    # installs tokenis-mcp from the GitHub Pages index on first run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npx -y @anthropic-ai/mcpb validate packaging/mcpb/manifest.json
      - run: npx -y @anthropic-ai/mcpb pack packaging/mcpb tokenis.mcpb
      - uses: actions/upload-artifact@v7
        with:
          name: mcpb
          path: tokenis.mcpb

  sbom:
    # CycloneDX software bills of materials: the Python package as installed
    # with every runtime extra, each Rust crate, and the TypeScript SDK.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheels-ubuntu-latest-x86_64-auto
          path: wheels
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: Generate SBOMs
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p sbom
          python -m venv /tmp/runtime
          wheel="$(ls wheels/*manylinux*x86_64*.whl | head -1)"
          /tmp/runtime/bin/pip install "${wheel}[postgres,mysql,oracle,mssql,aws,gcp,azure]"
          pip install cyclonedx-bom
          cyclonedx-py environment --of JSON --output-reproducible -o "sbom/tokenis-mcp-${v}-python.cdx.json" /tmp/runtime
          PYO3_PYTHON="$(which python)" cargo cyclonedx --format json --spec-version 1.5
          for crate in tokenis-core tokenis-py tokenis-wasm; do
            mv "crates/${crate}/${crate}.cdx.json" "sbom/${crate}-${v}-rust.cdx.json"
          done
          (cd sdk/typescript && npm ci --ignore-scripts && npm sbom --sbom-format cyclonedx --omit dev) \
            > "sbom/tokenis-crypto-${v}-npm.cdx.json"
          for f in sbom/*.json; do python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['bomFormat']=='CycloneDX'; print(sys.argv[1], len(d.get('components', [])))" "$f"; done
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, wheels, sdist, npm-package, mcpb, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*
      - uses: actions/attest-sbom@v3
        with:
          subject-path: artifacts/*.whl
          sbom-path: artifacts/tokenis-mcp-${{ steps.v.outputs.version }}-python.cdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign every file (Sigstore keyless; no long-lived key exists)
        working-directory: artifacts
        run: |
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" > /dev/null
          done
          ls
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # server.json names ghcr.io/tokenismcp/tokenis-mcp:<version> (no "v").
          tags: |
            ghcr.io/${{ github.repository_owner }}/tokenis-mcp:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/tokenis-mcp:latest
          # BuildKit's own SBOM and full provenance, stored with the image.
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/tokenis-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/tokenis-mcp@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: image.cdx.json
          upload-artifact: false
      - uses: actions/attest-sbom@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/tokenis-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: image.cdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (Sigstore keyless)
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/tokenis-mcp@${{ steps.push.outputs.digest }}"

  pages-index:
    # Rebuilt from every release's assets, so older versions stay installable.
    needs: [github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Build the package index from the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/build_index.py --out site --github-releases --repo "${{ github.repository }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  install-check:
    # The one-liner users will type, against the index just deployed.
    needs: [pages-index]
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
      - name: uvx from the GitHub Pages index
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            uvx --index https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/simple/ \
              "tokenis-mcp==$v" tools --demo --format anthropic > tools.json && break
            sleep 20
          done
          python3 -c "import json; assert len(json.load(open('tools.json'))) == 8"

  publish-mcp-registry:
    if: vars.PUBLISH_REGISTRY == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish-image]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  publish-npm:
    if: vars.PUBLISH_NPM == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, npm-package]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --access public ${{ github.event.repository.private && ' ' || '--provenance' }} ./*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
