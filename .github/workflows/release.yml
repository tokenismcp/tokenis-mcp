name: Release

# Builds distributable artifacts on a version tag (or manually):
#   - Python wheels (abi3: one per platform serves CPython >= 3.9) + sdist
#   - the npm package tarball for sdk/typescript
# Publishing to PyPI / npm and build-provenance attestation run only when the
# repository variable PUBLISH is "true", after these are configured:
#   - PyPI: add this repository as a Trusted Publisher for `tokenis-mcp`
#     (environment "pypi"); no API token is stored anywhere.
#   - npm (separate switch, PUBLISH_NPM = "true"): an "npm" environment
#     holding an NPM_TOKEN secret with publish rights to the `@tokenis` scope
#     (confirm you own the scope first).
#     npm provenance needs a public source repository, so it is added only
#     when this repository is public.
#   - GHCR: nothing to configure (GITHUB_TOKEN); the image is pushed to
#     ghcr.io/<owner>/tokenis-mcp.
#   - MCP Registry: publishes server.json once PyPI has the release,
#     authenticated by GitHub OIDC (the namespace io.github.tokenismcp/* must
#     match the repository owner). server.json lists the PyPI package; add
#     the OCI image to it once ghcr.io/tokenismcp/tokenis-mcp is public (the
#     registry must be able to pull it to verify its label).
# Every release also attaches the Claude Desktop bundle (tokenis.mcpb).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    # A tag must match every manifest's version, or the artifacts would
    # claim a version the source does not.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches pyproject.toml, Cargo.toml and package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          rs=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          js=$(node -p "require('./sdk/typescript/package.json').version")
          echo "tag=$tag pyproject=$py cargo=$rs npm=$js"
          test "$tag" = "$py" && test "$tag" = "$rs" && test "$tag" = "$js"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Plugin, marketplace, server.json and MCPB versions match too
        run: |
          pip install jsonschema
          python -c "import sys; sys.path.insert(0, 'packaging'); import check_packaging as c; c.check_versions(); c.check_server_json()"

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `smoke`: the wheel matches the runner, so it can be installed
          # and exercised there (cross-compiled / musl wheels cannot).
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, smoke: true }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: macos-14, target: aarch64, smoke: true }
          - { os: macos-15-intel, target: x86_64, smoke: true }
          - { os: windows-latest, target: x64, smoke: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - name: Smoke-test the wheel
        if: matrix.smoke
        shell: bash
        run: |
          pip install "$(ls dist/*.whl)[server]"
          # Run outside the checkout so the installed wheel is imported, not
          # the uncompiled source tree.
          cd "$RUNNER_TEMP"
          python -c "from tokenis.crypto.ec_fhe import keygen, encrypt, decrypt; k = keygen(); assert decrypt(k.private, encrypt(k.public, 7)) == 7"
          tokenis-mcp tools --demo --format anthropic > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: sdist carries the license files
        run: tar tzf dist/*.tar.gz | grep -E '/(LICENSE|THIRD-PARTY-NOTICES.md)$'
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  npm-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci && npm run build:wasm && npm run typecheck && npm run build && npm test
      - run: npm run check:package
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: sdk/typescript/*.tgz

  mcpb:
    # The Claude Desktop extension: a manifest plus a uv entry point that
    # installs tokenis-mcp from PyPI on first run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npx -y @anthropic-ai/mcpb validate packaging/mcpb/manifest.json
      - run: npx -y @anthropic-ai/mcpb pack packaging/mcpb tokenis.mcpb
      - uses: actions/upload-artifact@v7
        with:
          name: mcpb
          path: tokenis.mcpb

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, wheels, sdist, npm-package, mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-image:
    if: vars.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # server.json names ghcr.io/tokenismcp/tokenis-mcp:<version> (no "v").
          tags: |
            ghcr.io/${{ github.repository_owner }}/tokenis-mcp:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/tokenis-mcp:latest
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/tokenis-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-mcp-registry:
    if: vars.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Wait until PyPI serves this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/tokenis-mcp/$v/json" >/dev/null && exit 0
            sleep 10
          done
          echo "PyPI does not list tokenis-mcp $v yet" && exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  publish-pypi:
    if: vars.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    if: vars.PUBLISH_NPM == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, npm-package]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --access public ${{ github.event.repository.private && ' ' || '--provenance' }} ./*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
