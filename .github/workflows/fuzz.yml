# Fuzzing. On pull requests and pushes touching the crypto core or the parsers:
# a short smoke run of every target. Nightly: long runs, with the corpus carried over
# between runs so coverage keeps growing. A crash fails the job and uploads
# the reproducer.
name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fuzz.yml"
      - "crates/tokenis-core/**"
      - "fuzz/**"
      - "tokenis/ledger.py"
      - "tokenis/keystore.py"
      - "tokenis/audit/**"
      - "tokenis/gateway/state.py"
      - "tokenis/config.py"
      - "tests/test_fuzz_inputs.py"
  pull_request:
    paths:
      - "crates/tokenis-core/**"
      - "fuzz/**"
      - "tokenis/ledger.py"
      - "tokenis/keystore.py"
      - "tokenis/audit/**"
      - "tokenis/gateway/state.py"
      - "tokenis/config.py"
      - "tests/test_fuzz_inputs.py"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per Rust target
        default: "600"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wire_formats, elgamal_arithmetic, decrypt_untrusted, delegation]
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '1800' || inputs.seconds || '60' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }} for ${{ env.SECONDS_PER_TARGET }}s
        working-directory: fuzz
        run: |
          set -o pipefail
          # cargo-fuzz from install-action is a static (musl) build and then
          # defaults to the musl target, which cannot be sanitised: name the host.
          if ! cargo fuzz run "${{ matrix.target }}" -O --target x86_64-unknown-linux-gnu -- \
              -max_total_time="$SECONDS_PER_TARGET" -print_final_stats=1 2>&1 | tee fuzz.log; then
            # The log needs a sign-in to read; an annotation does not.
            tail -n 25 fuzz.log | python3 -c "import sys; t=sys.stdin.read(); print('::error title=Fuzz ${{ matrix.target }} failed::' + t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

  python:
    # Property-based fuzzing of the ledger, keystore, audit trail, admission
    # log, ciphertext encodings and configuration (tests/test_fuzz_inputs.py).
    runs-on: ubuntu-latest
    env:
      TOKENIS_FUZZ_EXAMPLES: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '500' || '20000' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Property-based fuzzing
        run: |
          set -o pipefail
          if ! pytest -q tests/test_fuzz_inputs.py --tb=short 2>&1 | tee pytest.log; then
            tail -n 40 pytest.log | python3 -c "import sys; t=sys.stdin.read(); print('::error title=Python fuzzing failed::' + t[-1800:].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
