<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{title}} · Tokenis Console</title>
<link rel="icon" href="{{icon}}">
<style nonce="{{nonce}}">
:root { color-scheme: light; --bg: #f6f5f2; --surface: #fff; --border: #e6e2da; --text: #17191c; --muted: #6a707a; --accent-fill: #d9a765; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #0b0c0e; --surface: #121417; --border: #22262c; --text: #eceef1; --muted: #8a929e; --accent-fill: #d8a864; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
  font: 14px/1.55 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
.card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 28px 24px;
  box-shadow: 0 12px 32px -12px rgba(0, 0, 0, .25); }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; font-weight: 650; }
.brand img { width: 28px; height: 28px; }
h1 { font-size: 18px; margin: 0 0 6px; letter-spacing: -.01em; }
p { margin: 0; color: var(--muted); }
.btn { display: inline-flex; align-items: center; margin-top: 20px; height: 36px; padding: 0 14px; border-radius: 9px; background: var(--accent-fill);
  color: #1b1308; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="{{icon}}" alt="">Tokenis Console</div>
    <h1>{{title}}</h1>
    <p>{{text}}</p>
    {{action}}
  </main>
</body>
</html>
