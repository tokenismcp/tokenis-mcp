{{- if .Values.metrics.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tokenis.fullname" . }}-dashboard
  labels:
    {{- include "tokenis.labels" . | nindent 4 }}
    {{- with .Values.metrics.grafanaDashboard.labels }}{{ toYaml . | nindent 4 }}{{ end }}
data:
  tokenis.json: |-
{{ .Files.Get "files/grafana-dashboard.json" | indent 4 }}
{{- end }}
