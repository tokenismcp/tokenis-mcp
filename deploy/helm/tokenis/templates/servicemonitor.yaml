{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tokenis.fullname" . }}
  labels:
    {{- include "tokenis.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  selector:
    matchLabels: {{- include "tokenis.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- if .Values.metrics.tokenSecret }}
      authorization:
        type: Bearer
        credentials: {name: {{ .Values.metrics.tokenSecret }}, key: {{ .Values.metrics.tokenKey }}}
      {{- end }}
{{- end }}
