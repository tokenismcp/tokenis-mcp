{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tokenis.fullname" . }}
  labels: {{- include "tokenis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "tokenis.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: http, protocol: TCP}]
      {{- with .Values.networkPolicy.ingressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
