{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tokenis.fullname" . }}
  labels: {{- include "tokenis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "tokenis.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: http, protocol: TCP}]
      # Without ingressFrom, only pods in this namespace (an empty "from"
      # would admit every source, which is not what enabling a policy means).
      from: {{- toYaml (.Values.networkPolicy.ingressFrom | default (list (dict "podSelector" (dict)))) | nindent 8 }}
{{- end }}
