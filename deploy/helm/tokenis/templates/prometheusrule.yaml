{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "tokenis.fullname" . }}
  labels:
    {{- include "tokenis.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  {{- /* files/alerts.yml is a copy of deploy/monitoring/alerts.yml (tests check they match). */}}
  {{- $rules := .Files.Get "files/alerts.yml" | fromYaml }}
  {{- toYaml $rules | nindent 2 }}
{{- end }}
