global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tokenis
    # Every replica, found through Docker's DNS.
    dns_sd_configs:
      - names: [tokenis]
        type: A
        port: 8000
        refresh_interval: 15s
    metrics_path: /metrics
