# Round-robin across the gateway replicas. Streamable HTTP responses may be
# server-sent event streams, so buffering is off.
worker_processes auto;
events { worker_connections 1024; }

http {
    access_log off;
    server_tokens off;

    # Docker's DNS, re-resolved so scaled replicas are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        set $replicas tokenis:8000;

        location / {
            proxy_pass http://$replicas;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
            client_max_body_size 1m;
        }

        # Prometheus scrapes the replicas directly; keep metrics off the edge.
        location = /metrics { return 404; }
    }
}
