[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenis-mcp"
version = "0.1.0"
description = "Tokenis: a cryptographic disclosure-boundary gateway for LLM tool calling (MCP), with the research pipeline behind it"
readme = "README.md"
# SPDX license expression (PEP 639), not the deprecated `License ::`
# trove classifier / `{text = ...}` table form -- `python -m build` warns
# on the old form as of setuptools >=77.
license = "Apache-2.0"
authors = [
    { name = "Caleb Lee", email = "jlabsrd@gmail.com" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "ecdsa>=0.19",
]

[project.optional-dependencies]
# The MCP transport layer (tokenis/mcp_server) is the one part of this
# package that needs Python >=3.10 (the `mcp` package's own floor) -- kept
# as an optional extra so the crypto/semantic/gateway/audit core and the
# research/ reproduction code stay usable on Python 3.9.
server = ["mcp>=1.0"]
research = ["matplotlib>=3.7", "networkx>=3.1"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/j1729labs/tokenis-mcp"
Papers = "https://github.com/j1729labs/tokenis-mcp/tree/main/papers"

[tool.setuptools.packages.find]
include = ["tokenis*"]

[tool.setuptools.package-data]
# PEP 561: ships this package's inline type annotations to consumers'
# type checkers (mypy/pyright) instead of silently being treated as
# untyped. `mypy tokenis` (this repo's own CI check) verifies the
# annotations are correct; this marker is what tells *other* projects
# that installed this package they can trust them.
tokenis = ["py.typed"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "research/p3_leakage",
    "research/p4_admission",
    "tokenis/conformance",
    "tokenis/mcp_server",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# UP006/UP035/UP037/UP045 push PEP 585/604 generics (`dict[str, int]`,
# `X | None`) as bare (non-postponed) annotations, which this repo's
# Python 3.9 floor does not uniformly support; typing.Dict/List/Optional
# stay intentionally in place rather than being modernised file by file.
ignore = ["UP006", "UP035", "UP037", "UP045"]

[tool.mypy]
# Scoped to tokenis/ (the product SDK) rather than the whole repository:
# research/p3_leakage and research/p4_admission use bare same-directory
# imports (`import corpus`) by design, so they don't share one consistent
# module-resolution root with tokenis/ or with each other, and mypy's
# module-path uniqueness check rejects checking both trees in one run.
# `mypy tokenis` is what CI runs; see .github/workflows/ci.yml.
#
# python_version is pinned to 3.12, well above this package's actual 3.9
# floor, for two independent reasons: (1) recent mypy releases dropped
# the ability to type-check *against* a target as old as 3.9 at all (they
# still run fine *under* a 3.9 interpreter -- those are different
# things); (2) numpy's own bundled .pyi stubs use PEP 695 `type` alias
# syntax, which mypy only parses when the target is 3.12+, regardless of
# mypy's own version -- targeting anything lower fails on numpy's stub
# file itself, before it ever reaches this repository's code. tokenis/
# doesn't use any version-gated syntax (`from __future__ import
# annotations` plus typing.Dict/List throughout, matching ruff's
# target-version above), so raising the target here only affects what
# mypy permits while checking, not what the package requires at runtime.
python_version = "3.12"
warn_unused_configs = true
no_implicit_optional = true
# warn_return_any is deliberately off: tokenis/gateway/admission.py does
# heavy numpy array algebra, and numpy's own type stubs still return `Any`
# from several operations mypy can't see through -- turning this on trades
# real signal in tokenis/gateway/service.py's own code for noise from
# numpy's stub gaps in admission.py.
