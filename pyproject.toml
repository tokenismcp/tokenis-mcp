[build-system]
# The cryptographic core is Rust (crates/tokenis-core), compiled into the
# `tokenis._core` extension module; maturin builds it and packages it with
# the pure-Python `tokenis` package. abi3: one wheel per platform serves
# every CPython >= 3.10.
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tokenis-mcp"
version = "0.1.0"
description = "Tokenis: a cryptographic disclosure-boundary gateway for LLM tool calling (MCP), with the research pipeline behind it"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
keywords = ["mcp", "llm", "privacy", "homomorphic-encryption", "access-control", "audit"]
authors = [
    { name = "Caleb Lee", email = "jlabsrd@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Typing :: Typed",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "mcp>=2.2,<3",
    "pyjwt[crypto]>=2.8",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Kept for compatibility with `tokenis-mcp[server]` requirements; the server
# dependencies are part of the default install.
server = []
# Key-management services ([keys] provider); "local" and "vault-transit"
# need nothing extra.
aws = ["boto3>=1.34"]
gcp = ["google-cloud-kms>=3"]
azure = ["azure-keyvault-keys>=4.9", "azure-identity>=1.17"]
# Database sources ([data] url/url_env) through SQLAlchemy; postgres is also
# the shared state backend for multi-server deployments.
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2"]
mysql = ["sqlalchemy>=2.0", "pymysql>=1.1"]
oracle = ["sqlalchemy>=2.0", "oracledb>=2.0"]
mssql = ["sqlalchemy>=2.0", "pymssql>=2.3"]
snowflake = ["sqlalchemy>=2.0", "snowflake-sqlalchemy>=1.6"]
bigquery = ["sqlalchemy>=2.0", "sqlalchemy-bigquery>=1.11"]
# LLM API clients for `tokenis.llm.ask_*` and `tokenis-mcp ask`.
llm = ["tokenis-mcp[server]", "anthropic>=0.40", "openai>=1.50"]
research = ["matplotlib>=3.7", "networkx>=3.1"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8", "hypothesis>=6.100", "pip-audit>=2.7", "maturin>=1.7,<2", "pyyaml>=6"]

[project.scripts]
tokenis-mcp = "tokenis.cli:main"

[project.urls]
Homepage = "https://github.com/tokenismcp/tokenis-mcp"
Repository = "https://github.com/tokenismcp/tokenis-mcp"
Issues = "https://github.com/tokenismcp/tokenis-mcp/issues"
Changelog = "https://github.com/tokenismcp/tokenis-mcp/blob/main/CHANGELOG.md"
Papers = "https://github.com/tokenismcp/tokenis-mcp/tree/main/papers"

[tool.maturin]
manifest-path = "crates/tokenis-py/Cargo.toml"
module-name = "tokenis._core"
python-source = "."
python-packages = ["tokenis"]
features = ["pyo3/extension-module"]
# Ships tokenis/py.typed and tokenis/_core.pyi with the package (PEP 561).
include = [
    { path = "tokenis/py.typed", format = ["sdist", "wheel"] },
    { path = "tokenis/assets/*.png", format = ["sdist", "wheel"] },
    { path = "tokenis/assets/*.html", format = ["sdist", "wheel"] },
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "research/p3_leakage",
    "research/p4_admission",
    "tokenis/conformance",
    "tokenis/mcp_server",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# UP006/UP035/UP037/UP045 push PEP 585/604 generics (`dict[str, int]`,
# `X | None`) as bare (non-postponed) annotations, which this repo's
# code base kept in the older style; typing.Dict/List/Optional
# stay intentionally in place rather than being modernised file by file.
ignore = ["UP006", "UP035", "UP037", "UP045"]
# flake8-bandit security rules, enforced on the shipped SDK. Tests use
# `assert` by design; research/ and the conformance harness are
# reproduction code over synthetic data, not the product surface.
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"research/**" = ["S"]
"examples/**" = ["S"]
"tokenis/conformance/**" = ["S"]
"tokenis/mcp_server/test_server.py" = ["S"]
"scripts/**" = ["S"]
"packaging/**" = ["S"]
# Measurement harness, not product code: asserts, seeded PRNGs and
# subprocesses are the point; long report lines are built by concatenation.
"benchmarks/**" = ["S", "ISC004", "PLW1510"]

[tool.mypy]
# Scoped to tokenis/ (the product SDK) rather than the whole repository:
# research/p3_leakage and research/p4_admission use bare same-directory
# imports (`import corpus`) by design, so they don't share one consistent
# module-resolution root with tokenis/ or with each other, and mypy's
# module-path uniqueness check rejects checking both trees in one run.
# `mypy tokenis` is what CI runs; see .github/workflows/ci.yml.
#
# python_version is pinned to 3.12, above this package's actual 3.10
# floor, for two independent reasons: (1) recent mypy releases dropped
# the ability to type-check *against* old targets (they still run fine
# *under* an older interpreter -- those are different
# things); (2) numpy's own bundled .pyi stubs use PEP 695 `type` alias
# syntax, which mypy only parses when the target is 3.12+, regardless of
# mypy's own version -- targeting anything lower fails on numpy's stub
# file itself, before it ever reaches this repository's code. tokenis/
# doesn't use any version-gated syntax (`from __future__ import
# annotations` plus typing.Dict/List throughout, matching ruff's
# target-version above), so raising the target here only affects what
# mypy permits while checking, not what the package requires at runtime.
python_version = "3.12"
warn_unused_configs = true
no_implicit_optional = true
# warn_return_any is deliberately off: tokenis/gateway/admission.py does
# heavy numpy array algebra, and numpy's own type stubs still return `Any`
# from several operations mypy can't see through -- turning this on trades
# real signal in tokenis/gateway/service.py's own code for noise from
# numpy's stub gaps in admission.py.
