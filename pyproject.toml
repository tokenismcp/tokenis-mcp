[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenis-mcp"
version = "0.1.0"
description = "Tokenis: a cryptographic disclosure-boundary gateway for LLM tool calling (MCP), with the research pipeline behind it"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Caleb Lee", email = "jlabsrd@gmail.com" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "ecdsa>=0.19",
    "cryptography>=41",
    "mcp>=1.0",
]

[project.optional-dependencies]
research = ["matplotlib>=3.7", "networkx>=3.1"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/j1729labs/tokenis-mcp"
Papers = "https://github.com/j1729labs/tokenis-mcp/tree/main/papers"

[tool.setuptools.packages.find]
include = ["tokenis*"]

[tool.pytest.ini_options]
testpaths = ["tests", "research/p3_leakage", "research/p4_admission", "tokenis/conformance"]

[tool.ruff]
line-length = 100
target-version = "py39"
